services:
  # Run explicitly once before starting the API: docker compose run --rm download
  download:
    image: speech-age-gender-api:local
    build:
      context: .
    profiles: [setup]
    command: [speech-age-gender, download]
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      HF_HOME: /tmp/huggingface
    volumes:
      - ./models:/models

  api:
    image: speech-age-gender-api:local
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SPEECH_DEVICE: cpu
      SPEECH_CPU_THREADS: "4"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped
    stop_grace_period: 5m

